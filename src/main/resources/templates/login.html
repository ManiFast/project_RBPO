<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .msg { margin: 10px 0; padding: 8px 10px; border-radius: 6px; display: inline-block; }
        .ok { background: #e8f7e8; color: #1f6b1f; border: 1px solid #8dd18d; }
        .err { background: #ffe9e9; color: #9b1c1c; border: 1px solid #ef9a9a; }
        form { margin-bottom: 16px; }
        input { margin: 4px 0; }
    </style>
</head>
<body>
<h2>Вход</h2>

<div th:if="${success}" class="msg ok" th:text="${success}"></div>
<div th:if="${error}" class="msg err" th:text="${error}"></div>
<div th:if="${param.error}" class="msg err">Неверный логин или пароль</div>
<div th:if="${param.logout}" class="msg ok">Вы вышли</div>

<form method="post" action="/login">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div>
        <label>Логин:
            <input type="text" name="username" required/>
        </label>
    </div>
    <div>
        <label>Пароль:
            <input type="password" name="password" required/>
        </label>
    </div>
    <button type="submit">Войти</button>
</form>

<hr/>

<h3>Регистрация</h3>
<form method="post" action="/register">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input name="username" placeholder="username" required/>
    <input type="password" name="password" placeholder="password" required/>
    <button type="submit">Зарегистрироваться</button>
</form>

<p>Пароль: минимум 8 символов, заглавная, строчная, цифра и спецсимвол.</p>
</body>
</html>
