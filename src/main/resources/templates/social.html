<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Социальная сеть</title>
    <style>
        .post {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
<h2>Социальная сеть</h2>
<p><a href="/logout">Выйти</a></p>

<div>
    <h3>Создать пост</h3>
    <form method="post" action="/api/social/posts">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <textarea name="content" placeholder="Что у вас нового?" rows="4" cols="50" required></textarea><br/>
        <button type="submit">Опубликовать</button>
    </form>
</div>

<hr/>

<div>
    <h3>Все посты</h3>

    <div th:if="${posts != null and !posts.isEmpty()}">
        <div th:each="post : ${posts}" class="post">
            <div>
                <strong>Автор:</strong>
                <span th:if="${post.author != null}" th:text="${post.author.username}">User</span>
                <span th:if="${post.author == null}">Неизвестно</span>
                <br/>
                <strong>Текст:</strong> <span th:text="${post.content}">Content</span><br/>
                <strong>Дата:</strong> <span th:text="${post.createdAt}">Date</span>
            </div>

            <div style="margin-top: 10px;">
                <form method="post" th:action="@{/api/social/posts/{id}/like(id=${post.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">❤️ Лайк</button>
                </form>
            </div>

            <div style="margin-top: 10px;">
                <h4>Комментарии</h4>

                <div th:if="${commentsByPost != null and commentsByPost.get(post.id) != null}">
                    <div th:each="comment : ${commentsByPost.get(post.id)}"
                         style="border-left: 2px solid #007bff; padding-left: 10px; margin: 5px 0;">
                        <strong th:text="${comment.author.username}">User</strong>:
                        <span th:text="${comment.content}">Comment</span>
                        <br/>
                        <small th:text="${comment.createdAt}">Date</small>
                    </div>
                </div>

                <form method="post" action="/api/social/comments" style="margin-top: 10px;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="postId" th:value="${post.id}"/>
                    <textarea name="content" placeholder="Ваш комментарий..." rows="2" cols="40" required></textarea>
                    <button type="submit">💬 Комментировать</button>
                </form>
            </div>
        </div>
    </div>

    <div th:if="${posts == null or posts.isEmpty()}">
        <p>Пока постов нет.</p>
    </div>
</div>

<hr/>

<div>
    <h3>Подписка</h3>
    <form id="followForm">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
        <input type="number" id="followUserId" placeholder="ID пользователя" required/>
        <button type="submit">Подписаться</button>
    </form>
</div>

<p><a href="/">На главную</a></p>

<script>
    document.getElementById('followForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const userId = document.getElementById('followUserId').value;
        const csrf = this.querySelector('input[name="_csrf"]').value;

        fetch('/api/social/users/' + userId + '/follow', {
            method: 'POST',
            headers: {
                'X-XSRF-TOKEN': csrf
            },
            credentials: 'same-origin'
        }).then(() => window.location.reload());
    });
</script>
</body>
</html>
