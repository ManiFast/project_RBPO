spring:
  application:
    name: project_RBPO

  datasource:
    url: jdbc:h2:file:./data/socialnetwork
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    ru.mtuci.coursemanagement: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  port: 8080