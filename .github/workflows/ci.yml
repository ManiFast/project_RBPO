name: CI

on:
  push:
    branches: ["main", "lab4.2", "lab5", "lab6", "lab6.2"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
      SSL_KEY_ALIAS: ${{ vars.SSL_KEY_ALIAS }}
      SSL_KEYSTORE_PATH: ${{ github.workspace }}/ci-keystore/server.jks
      SSL_KEYSTORE_BASE64: ${{ secrets.SSL_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Restore CI keystore from secret
        if: ${{ env.SSL_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p ci-keystore
          echo "$SSL_KEYSTORE_BASE64" | base64 -d > ci-keystore/server.jks

      - name: Build, test and package
        shell: bash
        run: mvn -B clean test package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: course-management-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
