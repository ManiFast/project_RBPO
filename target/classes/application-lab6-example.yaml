spring:
  application:
    name: project_RBPO

  datasource:
    url: jdbc:h2:file:./data/socialnetwork
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    ru.mtuci.coursemanagement: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

jwt:
  secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
  access-ttl-minutes: 15
  refresh-ttl-days: 7

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:file:./certs/out/rbpo-server-REPLACE_WITH_STUDENT_ID.jks}
    key-store-type: JKS
    key-store-password: ${SSL_KEYSTORE_PASSWORD:ServerPass_ChangeMe_123!}
    key-alias: ${SSL_KEY_ALIAS:rbpoSrvREPLACE_WITH_STUDENT_ID}
